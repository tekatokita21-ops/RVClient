
name: Build RV Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DVULKAN=OFF -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=ON

      - name: Build client
        run: cmake --build build --config Release --target game-client

      - name: Package game
        run: cmake --build build --config Release --target package_default

      - name: Prepare RV Client ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem build -Recurse -File -Filter "*win64.zip" |
            Where-Object { $_.Name -notlike "*symbols*" } |
            Select-Object -First 1

          if (-not $zip) {
            throw "Game package ZIP not found."
          }

          $stage = Join-Path $env:RUNNER_TEMP "RVClient"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath $stage -Force

          $exe = Get-ChildItem $stage -Recurse -File -Filter "DDNet.exe" |
            Select-Object -First 1

          if (-not $exe) {
            throw "DDNet.exe not found inside package."
          }

          Rename-Item -Path $exe.FullName -NewName "RVClient.exe"

          $output = Join-Path $env:RUNNER_TEMP "RVClient-Windows.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $output -Force

      - name: Upload RV Client
        uses: actions/upload-artifact@v4
        with:
          name: RVClient-Windows
          path: ${{ runner.temp }}/RVClient-Windows.zip
          if-no-files-found: error

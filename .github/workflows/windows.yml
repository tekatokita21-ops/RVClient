name: Build RV Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DVULKAN=OFF -DPREFER_BUNDLED_LIBS=ON -DDOWNLOAD_GTEST=ON

      - name: Build
        run: cmake --build build --config Release --target game-client

      - name: Check executable
        shell: pwsh
        run: |
          $exe = "build/release/DDNet.exe"

          if (!(Test-Path $exe)) {
            Write-Host "Executable not found. Searching build folder..."
            Get-ChildItem -Path build -Recurse -Filter *.exe |
              Select-Object -ExpandProperty FullName
            throw "DDNet.exe was not found."
          }

          Write-Host "Executable found: $exe"

      - name: Rename executable
        shell: pwsh
        run: |
          Rename-Item `
            -Path "build/release/DDNet.exe" `
            -NewName "RVClient.exe"

      - name: Upload RV Client
        uses: actions/upload-artifact@v4
        with:
          name: RVClient-Windows
          path: build/release/RVClient.exe
          if-no-files-found: error
